[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ai"
version = "0.1.0"
description = "Document AI demo: OCR, validated invoice extraction, and field-level evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arpan Bom" }]
keywords = ["ocr", "invoices", "document-ai", "extraction"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115",
  "pillow>=10.4",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr-tesseract = ["pytesseract>=0.3.13"]
ocr-doctr = ["python-doctr>=0.9"]
server = ["uvicorn>=0.30"]
dev = ["httpx>=0.27", "pytest>=8.2", "ruff==0.17.1"]

[project.scripts]
document-ai = "document_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["document_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
